# ─── Golden path CI: test → build → push → Trivy → SBOM → cosign ──
#
# Luồng:
#   - merge vào main  → build image :<sha> + push GHCR + scan + sign
#   - tag v*          → build image :<tag> + push GHCR + scan + sign
#   - pull request    → chỉ chạy test (không build)
#
# Secrets:
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD → BẮT BUỘC cho bước ký (thiếu → CI FAIL,
#     fail-securely, không skip). Đã set cho template repo.
#   SONAR_TOKEN / SONAR_HOST_URL         → SonarQube (TẠM THỜI SKIP, if: false).
# Build/push/Trivy/SBOM không cần secret (GHCR dùng GITHUB_TOKEN).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # <owner>/<repo> — tag image trùng tên repo

jobs:
  # ── Matrix test Node 20/22/24 (đang COMMENT để chạy nhanh) ─────
  # Bỏ comment khi cần test trên nhiều Node version cùng lúc.
  # test:
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       node: [20, 22, 24]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ matrix.node }}
  #         cache: npm
  #     - run: npm ci
  #     - run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build-push-scan-sign:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # secrets KHÔNG dùng được trong if → load qua job-level env, check bằng env context
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Trivy scan IMAGE (table — chi tiết + tổng HIGH/CRITICAL) ──
      # GHCR public → trivy pull image trực tiếp, không cần auth.
      # Table in ra log: chi tiết từng CVE + dòng "Total: N (HIGH: X, CRITICAL: Y)"
      # cho từng section (OS, npm) → đủ để đọc, không cần scan thêm json/sarif.
      - name: Trivy scan image (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: 1   # có HIGH/CRITICAL → FAIL build (không bỏ lọt lỗi)

      # ── SBOM (syft) — quét ĐÚNG image vừa build ───────────────
      # Input đúng là `output-file` (không phải `output`) → ghi file sbom.spdx.json
      # vào workspace. Quét image (thay vì path) để SBOM khớp image được sign/attest.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # ── Cosign: sign image + attest SBOM (BẮT BUỘC — không skip) ──
      # GH Actions giữ nguyên newline của secret → dùng env:// an toàn.
      # Dùng cosign attest (SBOM ĐƯỢC ký) thay vì cosign attach sbom
      # (attach đã deprecated + không ký SBOM).
      - uses: sigstore/cosign-installer@v3
      - name: Sign image + attest SBOM (cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMG"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
            --type spdx --predicate sbom.spdx.json "$IMG"

  # ── SonarQube scan — TẠM THỜI SKIP (if: false) ──────────────
  # Bật lại: đổi `if: false` → `if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''`
  # và thêm 2 secrets SONAR_TOKEN + SONAR_HOST_URL.
  sonar:
    needs: test
    if: false
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: sonarsource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.sources=src


