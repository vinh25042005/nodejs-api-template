# ─── Golden path CI: test → build → push → Trivy → SBOM → cosign ──
#
# Luồng:
#   - merge vào main  → build image :<sha> + push GHCR + scan + sign
#   - tag v*          → build image :<tag> + push GHCR + scan + sign
#   - pull request    → chỉ chạy test (không build)
#
# Secrets (OPTIONAL — bước chưa có secret sẽ tự skip, không fail CI):
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD → ký image (cosign sign + attach SBOM)
#   SONAR_TOKEN / SONAR_HOST_URL         → job SonarQube scan
# Build/push/Trivy/SBOM không cần secret (GHCR dùng GITHUB_TOKEN).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # <owner>/<repo> — tag image trùng tên repo

jobs:
  # ── Matrix test Node 18/20/22 (đang COMMENT để chạy nhanh) ─────
  # Bỏ comment khi cần test trên nhiều Node version cùng lúc.
  # test:
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       node: [18, 20, 22]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ matrix.node }}
  #         cache: npm
  #     - run: npm ci
  #     - run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-push-scan-sign:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # secrets KHÔNG dùng được trong if → load qua job-level env, check bằng env context
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "image_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Trivy scan ─────────────────────────────────────────────
      # Quét source tree (fs) — KHÔNG quét image để tránh pull GHCR private.
      # exit-code: 0 → có lỗ hổng vẫn không fail build (như Jenkins).
      - name: Trivy scan (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

      # ── SBOM (syft) ────────────────────────────────────────────
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output: sbom.spdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # ── Cosign sign + attach SBOM (chạy khi có COSIGN_PRIVATE_KEY) ──
      # GH Actions giữ nguyên newline của secret → dùng env:// an toàn
      # (khác Jenkins phải rebuild PEM bằng tay).
      - uses: sigstore/cosign-installer@v3
        if: env.COSIGN_PRIVATE_KEY != ''
      - name: Sign + attach SBOM (cosign)
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attach sbom --sbom sbom.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  # ── SonarQube scan (chạy khi có SONAR_TOKEN + SONAR_HOST_URL) ──
  # env KHÔNG dùng được trong job-level if → gating ở STEP level
  # (step-level if có cả env + secrets).
  sonar:
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
      - uses: sonarsource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.sources=src


